appId: fr.berliat.hskwidget
---
# CUJ: Annotations / P0 / Delete an annotation.
# Setup: setup1 (needs annotated 你好).

- runFlow:
    file: ../setup/00_setup1.yaml
- tapOn: "Menu"
- tapOn: "Dictionary"
- tapOn: "Search pinyin, definition, hanzi"
- eraseText: 100
- inputText: "nihao"
- hideKeyboard
- assertVisible: "你"
- tapOn: "Annotate a word"
- tapOn: "Delete"
- assertVisible: "Confirm deletion"
- tapOn: "Delete"
- assertVisible: "你好 successfully deleted"
